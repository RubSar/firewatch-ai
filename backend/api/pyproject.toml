[project]
name = "firewatch-fuel-service"
version = "0.1.0"
description = "Dynamic World and Sentinel-2 experimental fuel index API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "earthengine-api>=1.5,<2", "shapely>=2.1,<3", "pyproj>=3.7,<4"]

[project.optional-dependencies]
research = ["numpy>=2.3,<3", "jsonschema>=4.23,<5", "pyshp>=2.3,<3", "pypdf>=5,<7", "pypdfium2>=4,<6", "pillow>=11,<13"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
