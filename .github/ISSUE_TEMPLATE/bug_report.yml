name: Bug report
description: Report a reproducible software or documentation problem.
body:
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
      description: Include the affected page, command or file.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and environment
      description: Include code revision, OS, runtime versions and minimal steps. Remove credentials and personal data.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and scope
      description: Sanitized logs, screenshots, relevant tests and whether data were cached, live or synthetic.
